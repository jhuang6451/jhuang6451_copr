name: Trigger Build for Packages

on:
  # 添加手动触发
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual rebuild of all packages in .release'
  push:
    branches:
      - "release"
      - "test"
    paths:
      - '**/*.spec'
      - '.release'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.process_packages.outputs.build_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          # 如果是 push 事件，我们需要比较上一个 commit，所以 depth 为 2
          # 如果是手动触发，depth 1 就够了，但保持 2也没问题
          fetch-depth: 2

      - name: Determine packages to build
        id: process_packages
        run: |
          # set -x

          if [ ! -f .release ]; then
            echo ".release file not found!"
            exit 1
          fi
          
          EVENT_NAME="${{ github.event_name }}"
          echo "Trigger event: $EVENT_NAME"

          build_list="[]"
          
          while IFS= read -r pkg_name || [[ -n "$pkg_name" ]]; do
            # 去除可能的空白字符
            pkg_name=$(echo "$pkg_name" | xargs)
            if [ -z "$pkg_name" ] || [[ "$pkg_name" == \#* ]]; then
              continue
            fi

            echo "---------------------------------"
            echo "Processing package: $pkg_name"
            SPEC_FILE="${pkg_name}/${pkg_name}.spec"
            if [ ! -f "$SPEC_FILE" ]; then
              echo "::warning::Spec file not found for $pkg_name at $SPEC_FILE. Skipping."
              continue
            fi

            # 获取当前文件的 Version 和 Release
            # -F': *' 使用冒号和可选的空格作为分隔符
            VERSION=$(awk -F': *' '/^Version:/ {print $2; exit}' "$SPEC_FILE")
            RELEASE=$(awk -F': *' '/^Release:/ {print $2; exit}' "$SPEC_FILE")
            
            if [ -z "$VERSION" ]; then
              echo "::error::Could not parse Version from $SPEC_FILE. Skipping."
              continue
            fi
            
            FULL_VERSION="${VERSION}-${RELEASE}"
            SHOULD_BUILD=false

            # --- 逻辑分支开始 ---
            if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
              # 1. 手动触发模式：构建 .release 中的所有包
              echo "Manual trigger detected. Adding $pkg_name ($FULL_VERSION) to build list."
              SHOULD_BUILD=true
            else
              # 2. Push 触发模式：检查版本变化
              
              # 从上一个 commit 获取 spec 文件内容
              PREV_SPEC_CONTENT=$(git show HEAD~1:"$SPEC_FILE" 2>/dev/null)

              # 提取上一个版本的 Version 和 Release
              PREV_VERSION_RAW=$(echo "$PREV_SPEC_CONTENT" | awk -F': *' '/^Version:/ {print $2; exit}')
              PREV_RELEASE_RAW=$(echo "$PREV_SPEC_CONTENT" | awk -F': *' '/^Release:/ {print $2; exit}')

              # 如果上一个版本信息为空（例如，文件是新增的），则设置默认值 "0"
              PREV_VERSION=${PREV_VERSION_RAW:-"0"}
              PREV_RELEASE=${PREV_RELEASE_RAW:-"0"}

              echo "Current:  Version=${VERSION}, Release=${RELEASE}"
              echo "Previous: Version=${PREV_VERSION}, Release=${PREV_RELEASE}"

              # 检查 Version 或 Release 是否发生变化
              if [ "$VERSION" != "$PREV_VERSION" ] || [ "$RELEASE" != "$PREV_RELEASE" ]; then
                echo "Version change detected: ${PREV_VERSION}-${PREV_RELEASE} -> ${FULL_VERSION}"
                SHOULD_BUILD=true
              else
                echo "No version change for $pkg_name."
              fi
            fi
            # --- 逻辑分支结束 ---

            # 如果需要构建，添加到 JSON 数组
            if [ "$SHOULD_BUILD" == "true" ]; then
              build_list=$(echo "$build_list" | jq -c --arg name "$pkg_name" --arg ver "$FULL_VERSION" '. + [{"name": $name, "version": $ver}]')
            fi

          done < .release

          echo "Final build list: $build_list"
          # 设置 output，改名为 build_list 以反映它不仅仅是 changed
          echo "build_list=${build_list}" >> $GITHUB_OUTPUT
        shell: bash

