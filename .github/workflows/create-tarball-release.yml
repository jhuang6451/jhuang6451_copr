name: Trigger Build for Packages

on:
  workflow_dispatch:
    inputs:
      reason:
        description: 'Reason for manual trigger'
        required: false
        default: 'Manual rebuild of all packages in .release'
  push:
    branches:
      - "release"
      - "test"
    paths:
      - '**/*.spec'
      - '.release'

jobs:
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      changed_packages: ${{ steps.process_packages.outputs.build_list }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 2

      - name: Determine packages to build
        id: process_packages
        run: |
          # set -x

          if [ ! -f .release ]; then
            echo ".release file not found!"
            exit 1
          fi
          
          EVENT_NAME="${{ github.event_name }}"
          echo "Trigger event: $EVENT_NAME"

          build_list="[]"
          
          # 将变量名从 pkg_name 改为 pkg_path 以更清晰地反映其内容
          while IFS= read -r pkg_path || [[ -n "$pkg_path" ]]; do
            # 去除可能的空白字符
            pkg_path=$(echo "$pkg_path" | xargs)
            if [ -z "$pkg_path" ] || [[ "$pkg_path" == \#* ]]; then
              continue
            fi

            # --- NEW: 使用 basename 提取真实的包名 ---
            # 例如，如果 pkg_path 是 "nerd-fonts/agave", pkg_basename 将是 "agave"
            pkg_basename=$(basename "$pkg_path")
            echo "---------------------------------"
            echo "Processing path: $pkg_path (Package name: $pkg_basename)"
            
            # --- UPDATED: 构建正确的 spec 文件路径 ---
            SPEC_FILE="${pkg_path}/${pkg_basename}.spec"

            if [ ! -f "$SPEC_FILE" ]; then
              echo "::warning::Spec file not found for $pkg_basename at $SPEC_FILE. Skipping."
              continue
            fi

            # 获取当前文件的 Version 和 Release
            VERSION=$(awk -F': *' '/^Version:/ {print $2; exit}' "$SPEC_FILE")
            RELEASE=$(awk -F': *' '/^Release:/ {print $2; exit}' "$SPEC_FILE")
            
            if [ -z "$VERSION" ]; then
              echo "::error::Could not parse Version from $SPEC_FILE. Skipping."
              continue
            fi
            
            FULL_VERSION="${VERSION}-${RELEASE}"
            SHOULD_BUILD=false

            if [ "$EVENT_NAME" == "workflow_dispatch" ]; then
              echo "Manual trigger detected. Adding $pkg_basename ($FULL_VERSION) to build list."
              SHOULD_BUILD=true
            else
              PREV_SPEC_CONTENT=$(git show HEAD~1:"$SPEC_FILE" 2>/dev/null)
              PREV_VERSION_RAW=$(echo "$PREV_SPEC_CONTENT" | awk -F': *' '/^Version:/ {print $2; exit}')
              PREV_RELEASE_RAW=$(echo "$PREV_SPEC_CONTENT" | awk -F': *' '/^Release:/ {print $2; exit}')
              PREV_VERSION=${PREV_VERSION_RAW:-"0"}
              PREV_RELEASE=${PREV_RELEASE_RAW:-"0"}

              echo "Current:  Version=${VERSION}, Release=${RELEASE}"
              echo "Previous: Version=${PREV_VERSION}, Release=${PREV_RELEASE}"

              if [ "$VERSION" != "$PREV_VERSION" ] || [ "$RELEASE" != "$PREV_RELEASE" ]; then
                echo "Version change detected: ${PREV_VERSION}-${PREV_RELEASE} -> ${FULL_VERSION}"
                SHOULD_BUILD=true
              else
                echo "No version change for $pkg_basename."
              fi
            fi

            if [ "$SHOULD_BUILD" == "true" ]; then
              # --- UPDATED: 在 JSON 中同时添加 path 和 name ---
              build_list=$(echo "$build_list" | jq -c \
                --arg path "$pkg_path" \
                --arg name "$pkg_basename" \
                --arg ver "$FULL_VERSION" \
                '. + [{"path": $path, "name": $name, "version": $ver}]')
            fi

          done < .release

          echo "Final build list: $build_list"
          echo "build_list=${build_list}" >> $GITHUB_OUTPUT
        shell: bash

