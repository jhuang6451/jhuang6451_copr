  trigger-copr-build:
    needs: [detect-changes]
    if: fromJson(needs.detect-changes.outputs.changed_packages)[0] != null
    runs-on: ubuntu-latest
    container:
      image: fedora:42
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.detect-changes.outputs.changed_packages) }}
    steps:
      - name: Checkout repository code
        uses: actions/checkout@v4

      # Step name 使用 package.name 会更友好 (显示 "agave" 而不是 "nerd-fonts/agave")
      - name: Trigger Copr Build for ${{ matrix.package.name }}
        env:
          COPR_LOGIN: ${{ secrets.COPR_LOGIN }}
          COPR_USERNAME: ${{ secrets.COPR_USERNAME }}
          COPR_TOKEN: ${{ secrets.COPR_TOKEN }}
          COPR_URL: ${{ secrets.COPR_URL }}
          COPR_PROJECT: ${{ secrets.COPR_PROJECT }}

          CLONE_URL: "https://github.com/jhuang6451/jhuang6451_copr.git"
          COMMITTISH: ${{ github.ref_name }}
          # --- UPDATED: 使用 matrix 中的 path 和 name ---
          # SUBDIRECTORY 需要完整的路径, e.g., "nerd-fonts/agave"
          SUBDIRECTORY: ${{ matrix.package.path }}
          # SPEC 只需要包名, e.g., "agave.spec"
          SPEC: ${{ matrix.package.name }}.spec
        run: |
          echo "Triggering build for ${{ matrix.package.name }} (from path: ${{ matrix.package.path }}) version ${{ matrix.package.version }}"
          chmod +x ./scripts/trigger-copr-build.sh
          ./scripts/trigger-copr-build.sh